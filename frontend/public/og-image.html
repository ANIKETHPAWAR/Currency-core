<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrencyCore OG Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0A1D37 0%, #1a365d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 36px;
            color: #E5E7EB;
            margin-bottom: 30px;
        }
        .description {
            font-size: 24px;
            color: #9CA3AF;
            max-width: 800px;
            line-height: 1.4;
        }
        .accent {
            color: #60A5FA;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CURRENCYCORE</div>
        <div class="subtitle">FOREX TRADING</div>
        <div class="description">
            Master the art of <span class="accent">forex trading</span> with our expert-led courses.<br>
            Learn practical strategies and build real-world experience.
        </div>
    </div>
</body>
</html>
